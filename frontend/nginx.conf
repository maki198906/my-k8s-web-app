server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Все пути отдают index.html (SPA-режим)
    location / {
        try_files $uri /index.html;
    }

    # Health check для K8s readinessProbe
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Gzip для скорости
    gzip on;
    gzip_types text/html text/css application/javascript;
}