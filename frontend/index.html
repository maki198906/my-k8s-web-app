<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg: #f7f6f2; --surface: #ffffff; --border: #e2e0db;
      --text: #28251d; --text-muted: #7a7974;
      --primary: #01696f; --primary-hover: #0c4e54;
      --primary-light: #e8f2f1; --error: #c0392b;
      --success: #437a22; --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --radius: 12px; --tr: 180ms cubic-bezier(0.16,1,0.3,1);
    }
    [data-theme="dark"] {
      --bg: #171614; --surface: #1c1b19; --border: #2e2d2b;
      --text: #cdccca; --text-muted: #797876;
      --primary: #4f98a3; --primary-hover: #227f8b;
      --primary-light: #1a2e30; --error: #e57373;
      --success: #6daa45; --shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Satoshi', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column;
      transition: background var(--tr), color var(--tr);
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2rem; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 700; font-size: 1.1rem; color: var(--text);
      text-decoration: none;
    }
    .logo svg { color: var(--primary); }
    .theme-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      width: 36px; height: 36px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; color: var(--text-muted);
      transition: all var(--tr);
    }
    .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 3rem 1.5rem; gap: 1.25rem;
      max-width: 640px; margin: 0 auto; width: 100%;
    }
    .hero { text-align: center; margin-bottom: 0.75rem; }
    .hero h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700;
      line-height: 1.2; margin-bottom: 0.375rem;
    }
    .hero p { color: var(--text-muted); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; width: 100%;
      box-shadow: var(--shadow);
    }
    .input-row { display: flex; gap: 0.5rem; }

    input {
      flex: 1; height: 44px; padding: 0 1rem;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-family: inherit;
      font-size: 0.9375rem; transition: border-color var(--tr); outline: none; width: 100%;
    }
    input:focus { border-color: var(--primary); }
    input::placeholder { color: var(--text-muted); }

    .btn {
      height: 44px; padding: 0 1.25rem; border-radius: 8px;
      font-family: inherit; font-size: 0.9375rem; font-weight: 500;
      cursor: pointer; border: none; transition: all var(--tr);
      white-space: nowrap; display: flex; align-items: center; gap: 0.375rem;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
    }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

    .result {
      display: none; margin-top: 1rem; padding: 0.875rem 1rem;
      background: var(--primary-light); border: 1px solid var(--primary);
      border-radius: 8px; gap: 0.5rem; align-items: center;
    }
    .result.show { display: flex; }
    .result-url {
      flex: 1; font-weight: 500; color: var(--primary); font-size: 0.9375rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none;
    }
    .result-url:hover { text-decoration: underline; }
    .copy-btn {
      height: 32px; padding: 0 0.75rem; border-radius: 6px;
      background: var(--primary); color: white; border: none;
      font-family: inherit; font-size: 0.8125rem; font-weight: 500;
      cursor: pointer; transition: all var(--tr); flex-shrink: 0;
    }
    .copy-btn:hover { background: var(--primary-hover); }
    .copy-btn.copied { background: var(--success); }

    .error-msg {
      display: none; margin-top: 0.75rem; padding: 0.625rem 0.875rem;
      background: #fff0f0; border: 1px solid #ffcdd2;
      border-radius: 6px; color: var(--error); font-size: 0.875rem;
    }
    [data-theme="dark"] .error-msg { background: #2d1a1a; border-color: #5c2626; }
    .error-msg.show { display: block; }

    .section-title {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .section-title h2 {
      font-size: 0.9375rem; font-weight: 600; color: var(--text-muted);
      display: flex; align-items: center; gap: 0.375rem;
    }
    .chevron { transition: transform var(--tr); color: var(--text-muted); }
    .chevron.open { transform: rotate(180deg); }
    .collapsible { display: none; margin-top: 1rem; }
    .collapsible.show { display: block; }

    .auth-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }

    .table-wrap {
      overflow-x: auto; border-radius: 8px; border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead { background: var(--bg); }
    th {
      text-align: left; padding: 0.625rem 0.875rem; color: var(--text-muted);
      font-weight: 500; white-space: nowrap; border-bottom: 1px solid var(--border);
    }
    td { padding: 0.625rem 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }
    .code-cell {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8125rem;
      color: var(--primary); font-weight: 600;
    }
    .code-cell a { color: inherit; text-decoration: none; }
    .code-cell a:hover { text-decoration: underline; }
    .url-cell {
      max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: var(--text-muted);
    }
    .hits-badge {
      display: inline-flex; align-items: center; padding: 0.125rem 0.5rem;
      background: var(--primary-light); color: var(--primary);
      border-radius: 9999px; font-size: 0.75rem; font-weight: 600;
    }
    .del-btn {
      height: 28px; width: 28px; display: flex; align-items: center;
      justify-content: center; border-radius: 6px; background: none;
      border: 1px solid var(--border); color: var(--text-muted);
      cursor: pointer; transition: all var(--tr);
    }
    .del-btn:hover { border-color: var(--error); color: var(--error); background: #fff0f0; }
    [data-theme="dark"] .del-btn:hover { background: #2d1a1a; }

    .empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.875rem; }

    footer {
      text-align: center; padding: 1.25rem;
      color: var(--text-muted); font-size: 0.8125rem;
      border-top: 1px solid var(--border);
    }
    .pod-tag {
      font-family: 'SF Mono', monospace; font-size: 0.75rem; opacity: 0.5;
    }

    @media (max-width: 480px) {
      header { padding: 1rem; }
      main { padding: 1.5rem 1rem; }
      .input-row { flex-direction: column; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    URL Shortener
  </a>
  <button class="theme-btn" id="themeToggle" aria-label="Переключить тему">
    <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>
</header>

<main>
  <div class="hero">
    <h1>Сократи любую ссылку</h1>
    <p>Быстро, просто, без регистрации</p>
  </div>

  <!-- Shorten card -->
  <div class="card">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://example.com/very/long/url..." />
      <button class="btn btn-primary" id="shortenBtn" onclick="shortenUrl()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Сократить
      </button>
    </div>
    <div class="result" id="result">
      <a class="result-url" id="resultUrl" target="_blank"></a>
      <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Копировать</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Admin card -->
  <div class="card">
    <div class="section-title" onclick="toggleSection('adminBody', 'chevronAdmin')">
      <h2>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
        Admin панель
      </h2>
      <svg class="chevron" id="chevronAdmin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="collapsible" id="adminBody">
      <div class="auth-row">
        <input type="password" id="tokenInput" placeholder="Admin token..." />
        <button class="btn btn-ghost" onclick="loadLinks()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg>
          Загрузить
        </button>
      </div>
      <div id="linksContainer">
        <div class="empty">Введи токен и нажми «Загрузить»</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="pod-tag" id="podInfo"></div>
</footer>

<script>
  // Theme
  const html = document.documentElement;
  let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme();
  document.getElementById('themeToggle').addEventListener('click', () => { dark = !dark; applyTheme(); });
  function applyTheme() {
    html.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('themeIcon').innerHTML = dark
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }

  // Shorten
  document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') shortenUrl(); });
  async function shortenUrl() {
    const input = document.getElementById('urlInput');
    const btn = document.getElementById('shortenBtn');
    const result = document.getElementById('result');
    const resultUrl = document.getElementById('resultUrl');
    const errorMsg = document.getElementById('errorMsg');
    const url = input.value.trim();
    if (!url) return;

    result.classList.remove('show');
    errorMsg.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg> Сокращаю...';

    try {
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Ошибка'); }
      const data = await res.json();
      resultUrl.textContent = data.short_url;
      resultUrl.href = data.short_url;
      result.classList.add('show');
      document.getElementById('copyBtn').textContent = 'Копировать';
      document.getElementById('copyBtn').classList.remove('copied');
    } catch (e) {
      errorMsg.textContent = e.message;
      errorMsg.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Сократить';
    }
  }

  // Copy
  function copyUrl() {
    const url = document.getElementById('resultUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ Скопировано';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('copied'); }, 2000);
    });
  }

  // Toggle sections
  function toggleSection(bodyId, chevronId) {
    document.getElementById(bodyId).classList.toggle('show');
    document.getElementById(chevronId).classList.toggle('open');
  }
  const toggleAdmin = () => toggleSection('adminBody', 'chevronAdmin');

  // Admin: load links
  async function loadLinks() {
    const token = document.getElementById('tokenInput').value.trim();
    const container = document.getElementById('linksContainer');
    if (!token) { container.innerHTML = '<div class="empty">Введи admin токен</div>'; return; }
    container.innerHTML = '<div class="empty">Загружаю...</div>';
    try {
      const res = await fetch('/api/links', { headers: { 'X-Admin-Token': token } });
      if (res.status === 403) throw new Error('Неверный токен');
      if (!res.ok) throw new Error('Ошибка загрузки');
      const links = await res.json();
      if (!links.length) { container.innerHTML = '<div class="empty">Ссылок пока нет</div>'; return; }
      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Код</th><th>URL</th><th>Хитов</th><th>Дата</th><th></th></tr></thead>
            <tbody>
              ${links.map(l => `
                <tr id="row-${l.code}">
                  <td class="code-cell"><a href="${l.short_url}" target="_blank">${l.code}</a></td>
                  <td class="url-cell" title="${l.original_url}">${l.original_url}</td>
                  <td><span class="hits-badge">${l.hits}</span></td>
                  <td style="color:var(--text-muted);font-size:0.8125rem">${new Date(l.created_at).toLocaleDateString('ru')}</td>
                  <td>
                    <button class="del-btn" onclick="deleteLink('${l.code}')" title="Удалить">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/>
                      </svg>
                    </button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (e) {
      container.innerHTML = `<div class="empty" style="color:var(--error)">${e.message}</div>`;
    }
  }

  // Admin: delete
  async function deleteLink(code) {
    const token = document.getElementById('tokenInput').value.trim();
    if (!confirm(`Удалить ссылку ${code}?`)) return;
    try {
      const res = await fetch(`/api/links/${code}`, { method: 'DELETE', headers: { 'X-Admin-Token': token } });
      if (!res.ok) throw new Error('Ошибка удаления');
      document.getElementById(`row-${code}`)?.remove();
    } catch (e) { alert(e.message); }
  }

  // Pod info in footer
  fetch('/api/info').then(r => r.json()).then(d => {
    document.getElementById('podInfo').textContent = `pod: ${d.hostname} · v${d.version}`;
  }).catch(() => {});
</script>

</body>
</html>
